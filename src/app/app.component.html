<a
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-surface focus:px-3 focus:py-2"
  href="#main"
>
  Skip to content
</a>
<app-side-nav />
<div class="transition-[padding] duration-200" [class.md:pl-60]="shell.desktopNavOpen()">
  <app-topbar />
  @if (persistError(); as message) {
    <p class="mx-4 mt-4 rounded-2xl border border-bad bg-bad-bg px-4 py-3 text-bad md:mx-8" role="alert">{{ message }}</p>
  }
  @if (questions.status() === 'error') {
    <div class="mx-4 mt-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-bad bg-bad-bg px-4 py-3 text-bad md:mx-8" role="alert">
      <p>{{ questions.error() }}</p>
      <button type="button" class="btn btn-danger" (click)="reload()">Try again</button>
    </div>
  }
  <main id="main" class="px-4 pb-24 pt-6 md:px-8 md:pb-10">
    <router-outlet />
  </main>
</div>
<app-toast-container />
