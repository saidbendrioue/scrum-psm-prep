<header
  class="sticky top-0 z-20 flex flex-wrap items-center justify-between gap-3 border-b-[3px] border-line/80 bg-canvas/80 px-4 py-3 backdrop-blur-xl md:px-8"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="btn btn-ghost hidden size-11 shrink-0 p-0 md:inline-flex"
      [attr.aria-expanded]="shell.desktopNavOpen()"
      aria-controls="primary-nav"
      [attr.aria-label]="shell.desktopNavOpen() ? 'Hide navigation' : 'Show navigation'"
      (click)="shell.toggleDesktopNav()"
    >
      <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        @if (shell.desktopNavOpen()) {
          <path d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
    <div>
      <p class="brand-mark text-xl leading-tight md:text-2xl">PSM 1 <span>Quizz</span></p>
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">{{ pageTitle() }}</p>
    </div>
  </div>
  <div class="flex items-center gap-2">
    @if (progress.activeExam()) {
      <a class="btn btn-primary" routerLink="/exam/session">
        <svg viewBox="0 0 24 24" class="size-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 8v4l2.5 2.5" />
        </svg>
        Resume {{ timeLeft() }}
      </a>
    }
    <button
      type="button"
      class="btn btn-ghost"
      [attr.aria-pressed]="theme.theme() === 'dark'"
      (click)="theme.toggle()"
    >
      <svg viewBox="0 0 24 24" class="size-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        @if (theme.theme() === 'dark') {
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        } @else {
          <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" />
        }
      </svg>
      {{ theme.theme() === 'dark' ? 'Light' : 'Dark' }}
    </button>
  </div>
</header>
